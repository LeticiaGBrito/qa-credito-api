name: Testes e deploy

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credito-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    name: Testes com Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Executar os testes
        run: bash ./gradlew clean test --no-daemon

      - name: Disponibilizar relatórios de testes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-testes
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Solicitar deploy no Render
    needs: testes
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Publicar o commit aprovado nos testes
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::O segredo RENDER_DEPLOY_HOOK_URL não foi configurado."
            exit 1
          fi

          if [[ "$DEPLOY_HOOK" == *"?"* ]]; then
            SEPARADOR="&"
          else
            SEPARADOR="?"
          fi

          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --output /dev/null \
            --request POST \
            "${DEPLOY_HOOK}${SEPARADOR}ref=${COMMIT_SHA}"

          echo "Solicitação aceita pelo Render para o commit ${COMMIT_SHA}."
          echo "Acompanhe a conclusão da publicação no painel do Render."